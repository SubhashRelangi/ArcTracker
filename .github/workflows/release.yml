name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ARCTRACKER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ARCTRACKER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ARCTRACKER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ARCTRACKER_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Reconstructing release keystore from GitHub secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arctracker-release.jks"
            echo "ARCTRACKER_KEYSTORE_PATH=$RUNNER_TEMP/arctracker-release.jks" >> "$GITHUB_ENV"
            echo "ARCTRACKER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ARCTRACKER_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ARCTRACKER_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No secret keystore found. Generating standalone release keystore..."
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/arctracker-release.jks" \
              -alias "arctracker" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "arctracker123" \
              -keypass "arctracker123" \
              -dname "CN=ArcTracker, OU=Mobile, O=SubhashRelangi, L=City, S=State, C=IN"
            echo "ARCTRACKER_KEYSTORE_PATH=$RUNNER_TEMP/arctracker-release.jks" >> "$GITHUB_ENV"
            echo "ARCTRACKER_KEYSTORE_PASSWORD=arctracker123" >> "$GITHUB_ENV"
            echo "ARCTRACKER_KEY_ALIAS=arctracker" >> "$GITHUB_ENV"
            echo "ARCTRACKER_KEY_PASSWORD=arctracker123" >> "$GITHUB_ENV"
          fi

      - name: Build and Test Release Artifacts
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Verify Build Artifacts
        run: |
          test -f "app/build/outputs/apk/release/app-arm64-v8a-release.apk" || { echo "arm64-v8a APK not found"; exit 1; }
          test -f "app/build/outputs/apk/release/app-armeabi-v7a-release.apk" || { echo "armeabi-v7a APK not found"; exit 1; }
          test -f "app/build/outputs/apk/release/app-x86_64-release.apk" || { echo "x86_64 APK not found"; exit 1; }
          test -f "app/build/outputs/apk/release/app-universal-release.apk" || { echo "Universal APK not found"; exit 1; }

      - name: Verify APK Signature
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ]; then
            APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
              for apk in app/build/outputs/apk/release/*.apk; do
                echo "Verifying signature for $apk with $APKSIGNER..."
                "$APKSIGNER" verify --verbose "$apk"
              done
            fi
          fi

      - name: Generate Release Assets Guide
        run: |
          python3 -c "
          import os

          def get_size(path):
              try:
                  return f'~{os.path.getsize(path) / (1024 * 1024):.1f}MB'
              except Exception:
                  return 'N/A'

          arm64 = get_size('app/build/outputs/apk/release/app-arm64-v8a-release.apk')
          armv7 = get_size('app/build/outputs/apk/release/app-armeabi-v7a-release.apk')
          x86_64 = get_size('app/build/outputs/apk/release/app-x86_64-release.apk')
          univ = get_size('app/build/outputs/apk/release/app-universal-release.apk')

          content = f'''### 📦 Release Assets Guide
          Download the file according to your need, if ur unsure about your phone, Just download \`app-universal-release.apk\`

          | APK File | Architecture | Target Devices | Size |
          | :--- | :--- | :--- | :--- |
          | \`app-arm64-v8a-release.apk\` | **64-bit ARM** | Recommended: 95%+ of modern Android phones | {arm64} |
          | \`app-armeabi-v7a-release.apk\` | **32-bit ARM** | Older 32-bit Android devices | {armv7} |
          | \`app-x86_64-release.apk\` | **64-bit x86** | Android Emulators, ChromeOS, PCs | {x86_64} |
          | \`app-universal-release.apk\` | **Universal** | All devices (fallback all-in-one) | {univ} |
          '''

          with open('release_body.md', 'w') as f:
              f.write(content.strip() + '\n')
          "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ArcTracker ${{ github.ref_name }}
          body_path: release_body.md
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            app/build/outputs/apk/release/app-x86_64-release.apk
            app/build/outputs/apk/release/app-universal-release.apk

      - name: Clean up Keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/arctracker-release.jks"

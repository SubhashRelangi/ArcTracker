name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ARCTRACKER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ARCTRACKER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ARCTRACKER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ARCTRACKER_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Reconstructing release keystore from GitHub secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arctracker-release.jks"
            echo "ARCTRACKER_KEYSTORE_PATH=$RUNNER_TEMP/arctracker-release.jks" >> "$GITHUB_ENV"
            echo "ARCTRACKER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ARCTRACKER_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ARCTRACKER_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No secret keystore found. Generating standalone release keystore..."
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/arctracker-release.jks" \
              -alias "arctracker" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "arctracker123" \
              -keypass "arctracker123" \
              -dname "CN=ArcTracker, OU=Mobile, O=SubhashRelangi, L=City, S=State, C=IN"
            echo "ARCTRACKER_KEYSTORE_PATH=$RUNNER_TEMP/arctracker-release.jks" >> "$GITHUB_ENV"
            echo "ARCTRACKER_KEYSTORE_PASSWORD=arctracker123" >> "$GITHUB_ENV"
            echo "ARCTRACKER_KEY_ALIAS=arctracker" >> "$GITHUB_ENV"
            echo "ARCTRACKER_KEY_PASSWORD=arctracker123" >> "$GITHUB_ENV"
          fi

      - name: Build and Test Release Artifacts
        run: ./gradlew testDebugUnitTest assembleRelease bundleRelease

      - name: Verify Build Artifacts
        run: |
          test -f "app/build/outputs/apk/release/app-release.apk" || { echo "Release APK not found"; exit 1; }
          test -f "app/build/outputs/bundle/release/app-release.aab" || { echo "Release AAB not found"; exit 1; }

      - name: Verify APK Signature
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ]; then
            APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
              echo "Verifying signature with $APKSIGNER..."
              "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
            fi
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ArcTracker ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab

      - name: Clean up Keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/arctracker-release.jks"

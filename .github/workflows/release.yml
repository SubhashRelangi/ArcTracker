name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    env:
      ARCTRACKER_KEYSTORE_PATH: ${{ runner.temp }}/arctracker-upload.jks
      ARCTRACKER_KEYSTORE_PASSWORD: ${{ secrets.ARCTRACKER_KEYSTORE_PASSWORD }}
      ARCTRACKER_KEY_ALIAS: ${{ secrets.ARCTRACKER_KEY_ALIAS }}
      ARCTRACKER_KEY_PASSWORD: ${{ secrets.ARCTRACKER_KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Reconstruct Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ARCTRACKER_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/arctracker-upload.jks"

      - name: Build and Test Release Artifacts
        run: ./gradlew testDebugUnitTest assembleRelease bundleRelease

      - name: Verify Build Artifacts
        run: |
          test -f "app/build/outputs/apk/release/app-release.apk" || { echo "Release APK not found"; exit 1; }
          test -f "app/build/outputs/bundle/release/app-release.aab" || { echo "Release AAB not found"; exit 1; }

      - name: Verify APK Signature
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Error: ANDROID_HOME or ANDROID_SDK_ROOT is not set"
            exit 1
          fi
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "Error: apksigner executable not found under $SDK_ROOT/build-tools"
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ArcTracker ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab

      - name: Clean up Keystore
        if: always()
        run: |
          rm -f "${{ runner.temp }}/arctracker-upload.jks"
